name: Build Kefirstan VTuber APK
on:
  workflow_dispatch:
  push:
    branches:
      - kefirstan-vtuber-android
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Extract Android sources
        run: |
          unzip -qo project-source.zip -d .
          cp -a hotfix/app/. app/
          test -f app/src/main/java/space/aurelia/kefirvtuber/MainActivity.java
          grep -q SCREEN_ORIENTATION_LANDSCAPE app/src/main/java/space/aurelia/kefirvtuber/MainActivity.java
          test -f app/build.gradle
          test -f app/src/main/assets/presidential_office.obj
          echo "Source and 3D assets found"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kefirstan-VTuber-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
